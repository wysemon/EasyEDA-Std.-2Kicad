[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyeda2kicad-local"
version = "0.1.0"
description = "Link-driven local EasyEDA Standard to KiCad converter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1", "rich>=13,<15"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
easyeda2kicad-local = "easyeda2kicad_local.cli:main"
ee2kicad = "easyeda2kicad_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
