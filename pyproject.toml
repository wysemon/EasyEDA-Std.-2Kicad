[build-system]
# SPDX license expressions need the PEP 639 support in this backend series.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "EasyEDA-Std.-2Kicad"
version = "1.2.0"
description = "Local 2D EasyEDA Standard to KiCad symbol and footprint converter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1", "rich>=13,<15"]

[project.urls]
Repository = "https://github.com/wysemon/EasyEDA-Std.-2Kicad"
Issues = "https://github.com/wysemon/EasyEDA-Std.-2Kicad/issues"
Documentation = "https://github.com/wysemon/EasyEDA-Std.-2Kicad#readme"

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
euc2k = "easyeda2kicad_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: optional public EasyEDA smoke test; never run in CI",
           "kicad: offline native KiCad import, upgrade, SVG or physical geometry checks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"
