[build-system]
# SPDX license expressions need the PEP 639 support in this backend series.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "euc2k"
version = "1.4.1"
description = "EasyEDA User Contributed To KiCad"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1", "rich>=13,<15"]

[project.urls]
Repository = "https://github.com/wysemon/euc2k.py"
Issues = "https://github.com/wysemon/euc2k.py/issues"
Documentation = "https://wysemon.github.io/euc2k.py/"
Changelog = "https://github.com/wysemon/euc2k.py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
euc2k = "euc2k.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: optional public EasyEDA smoke test; never run in CI",
           "kicad: offline native KiCad import, upgrade, SVG or physical geometry checks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"
