[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyeda2kicad-local"
version = "0.1.0"
description = "Link-driven local EasyEDA Standard to KiCad converter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1", "rich>=13,<15"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
easyeda2kicad-local = "easyeda2kicad_local.cli:main"
ee2kicad = "easyeda2kicad_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: optional public EasyEDA smoke test; never run in CI"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
