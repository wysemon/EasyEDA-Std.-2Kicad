name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Require a version-matched release tag
        id: metadata
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Stable release version required'
          assert os.environ['GITHUB_REF_TYPE'] == 'tag', 'Run this workflow on a release tag'
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag/version mismatch'
          assert f"__version__ = '{version}'" in Path('src/euc2k/__init__.py').read_text()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'version={version}\n')
          PY
      - name: Require all seven tag CI checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          for attempt in range(120):
              runs = json.loads(subprocess.check_output([
                  'gh', 'run', 'list', '--repo', os.environ['GITHUB_REPOSITORY'],
                  '--workflow', 'ci.yml', '--branch', os.environ['GITHUB_REF_NAME'],
                  '--commit', os.environ['GITHUB_SHA'], '--event', 'push',
                  '--limit', '1', '--json', 'databaseId,status,conclusion',
              ], text=True))
              if runs and runs[0]['status'] == 'completed':
                  run = runs[0]
                  assert run['conclusion'] == 'success', 'Tag CI failed; publishing refused'
                  details = json.loads(subprocess.check_output([
                      'gh', 'run', 'view', str(run['databaseId']), '--repo',
                      os.environ['GITHUB_REPOSITORY'], '--json', 'headSha,jobs',
                  ], text=True))
                  assert details['headSha'] == os.environ['GITHUB_SHA']
                  assert len(details['jobs']) == 7
                  assert all(job['conclusion'] == 'success' for job in details['jobs'])
                  break
              time.sleep(10)
          else:
              raise SystemExit('Timed out waiting for tag CI; publishing refused')
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Validate the exact wheel in a clean environment
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/euc2k-wheel"
          "$RUNNER_TEMP/euc2k-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/euc2k-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/euc2k-wheel/bin/python" scripts/verify_dist.py --version "$RELEASE_VERSION" --fixtures "$GITHUB_WORKSPACE/tests/fixtures"
      - name: Record artifact checksums
        run: sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/euc2k/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
      - run: sha256sum --check SHA256SUMS
      - name: Refuse an existing production PyPI version
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import os, urllib.error, urllib.request
          url = f"https://pypi.org/pypi/euc2k/{os.environ['RELEASE_VERSION']}/json"
          try:
              urllib.request.urlopen(url, timeout=30)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit('PyPI version already exists; publishing refused')
          PY
      - name: Publish to production PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
      - run: sha256sum --check SHA256SUMS
      - name: Publish GitHub release with the validated distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" dist/* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "euc2k.py $RELEASE_TAG" --verify-tag --latest --notes-file CHANGELOG.md
