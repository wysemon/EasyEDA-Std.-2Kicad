name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      EUC2K_DISABLE_LIVE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m "not live"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
  kicad:
    # Use one shared KiCad 8 output format, checked by each native major version.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kicad: ['8', '9', '10']
    env:
      EUC2K_DISABLE_LIVE: '1'
      EUC2K_REQUIRE_KICAD: '1'
      EUC2K_REQUIRE_PCBNEW: '1'
      EUC2K_EXPECT_MAJOR: ${{ matrix.kicad }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native KiCad from the KiCad team's stable PPA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-${{ matrix.kicad }}.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
      - name: Require the requested CLI and matching Python geometry bindings
        run: |
          command -v kicad-cli
          /usr/bin/python3 - <<'PY'
          import re
          import os
          import subprocess
          import pcbnew
          versions = {
              'CLI': subprocess.check_output(['kicad-cli', 'version'], text=True).strip(),
              'pcbnew': pcbnew.GetBuildVersion(),
          }
          for kind, version in versions.items():
              print(f'KiCad {kind}: {version}', flush=True)
              expected = int(os.environ['EUC2K_EXPECT_MAJOR'])
              if int(re.search(r'\d+', version)[0]) != expected:
                  raise SystemExit(f'Expected KiCad {expected} {kind}, found {version}')
          PY
      - run: python -m pip install -e ".[test]"
      - name: Offline native imports, upgrades, SVG and physical pad geometry
        run: python -m pytest -m "kicad and not live" -ra
