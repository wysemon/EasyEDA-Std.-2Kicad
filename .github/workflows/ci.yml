name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      EE2KICAD_DISABLE_LIVE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m "not live"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
  kicad:
    # Ubuntu 24.04's default package is KiCad 7; use the KiCad team's 8.0 PPA.
    # KiCad 9 is also exercised locally, not claimed as an additional CI matrix.
    runs-on: ubuntu-24.04
    env:
      EE2KICAD_DISABLE_LIVE: '1'
      EE2KICAD_REQUIRE_KICAD: '1'
      EE2KICAD_REQUIRE_PCBNEW: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native KiCad 8 from the KiCad team's PPA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
      - name: Require KiCad 8 CLI and matching Python geometry bindings
        run: |
          command -v kicad-cli
          /usr/bin/python3 - <<'PY'
          import re
          import subprocess
          import pcbnew
          versions = {
              'CLI': subprocess.check_output(['kicad-cli', 'version'], text=True).strip(),
              'pcbnew': pcbnew.GetBuildVersion(),
          }
          for kind, version in versions.items():
              print(f'KiCad {kind}: {version}', flush=True)
              if int(re.search(r'\d+', version)[0]) != 8:
                  raise SystemExit(f'Expected KiCad 8 {kind}, found {version}')
          PY
      - run: python -m pip install -e ".[test]"
      - name: Offline native imports, upgrades, SVG and physical pad geometry
        run: python -m pytest -m "kicad and not live" -ra
