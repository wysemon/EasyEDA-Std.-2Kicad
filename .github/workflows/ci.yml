name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      EE2KICAD_DISABLE_LIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m "not live"
      - run: python -m ruff check .
  kicad:
    # Ubuntu 24.04's distribution package supplies KiCad 8; log the exact build.
    # KiCad 9 is also exercised locally, not claimed as an additional CI matrix.
    runs-on: ubuntu-24.04
    env:
      EE2KICAD_DISABLE_LIVE: '1'
      EE2KICAD_REQUIRE_KICAD: '1'
      EE2KICAD_REQUIRE_PCBNEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native KiCad from Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
      - name: Require native CLI and Python geometry bindings
        run: |
          command -v kicad-cli
          kicad-cli version
          /usr/bin/python3 -c 'import pcbnew; print(pcbnew.GetBuildVersion())'
      - run: python -m pip install -e ".[test]"
      - name: Offline native imports, upgrades, SVG and physical pad geometry
        run: python -m pytest -m "kicad and not live" -ra
